<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>單位換算｜Kit</title>
  <link rel="stylesheet" href="../style.css">
  <style>
    .uc-wrap {
      background: #fff;
      border-radius: 20px;
      padding: 28px;
      border: 1px solid #e8edf3;
      box-shadow: 0 4px 20px rgba(0,0,0,0.07);
    }

    .category-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 28px;
      flex-wrap: wrap;
    }
    .tab-btn {
      padding: 8px 18px;
      border: 1px solid #e8edf3;
      border-radius: 999px;
      background: #f7f9fc;
      color: #666;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.15s;
    }
    .tab-btn.active {
      background: #2da58e;
      color: #fff;
      border-color: #2da58e;
    }
    .tab-btn:hover:not(.active) {
      border-color: #2da58e;
      color: #2da58e;
    }

    .converter-row {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 12px;
      align-items: center;
      margin-bottom: 20px;
    }
    .conv-side {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .conv-input {
      width: 100%;
      padding: 14px 16px;
      border: 1.5px solid #e8edf3;
      border-radius: 12px;
      font-size: 1.3rem;
      font-weight: 600;
      font-family: inherit;
      color: #1a1a2e;
      background: #f7f9fc;
      outline: none;
      transition: border-color 0.15s;
    }
    .conv-input:focus { border-color: #2da58e; background: #fff; }
    .conv-select {
      width: 100%;
      padding: 10px 14px;
      border: 1.5px solid #e8edf3;
      border-radius: 10px;
      font-size: 0.9rem;
      font-family: inherit;
      color: #1a1a2e;
      background: #fff;
      outline: none;
      cursor: pointer;
      transition: border-color 0.15s;
    }
    .conv-select:focus { border-color: #2da58e; }

    .swap-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1.5px solid #e8edf3;
      background: #fff;
      font-size: 1.2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
      margin-top: 20px;
      flex-shrink: 0;
    }
    .swap-btn:hover { background: #e8f5f0; border-color: #2da58e; }

    .common-table {
      margin-top: 8px;
    }
    .common-table h3 {
      font-size: 0.85rem;
      color: #aaa;
      font-weight: 600;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .table-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 8px;
    }
    .table-item {
      background: #f7f9fc;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 0.85rem;
      color: #555;
      border: 1px solid #e8edf3;
    }
    .table-item span { font-weight: 700; color: #1a1a2e; }
  </style>
</head>
<body>

  <nav class="navbar">
    <div class="nav-inner">
      <a href="../index.html" class="logo">⚙️ Kit</a>
    </div>
  </nav>

  <div class="tool-page-wrap" style="max-width:600px">
    <a href="../index.html" class="back-link">← 返回工具列表</a>
    <h1>📏 單位換算</h1>

    <div class="uc-wrap">
      <div class="category-tabs">
        <button class="tab-btn active" onclick="setCategory('length')">長度</button>
        <button class="tab-btn" onclick="setCategory('weight')">重量</button>
        <button class="tab-btn" onclick="setCategory('temperature')">溫度</button>
        <button class="tab-btn" onclick="setCategory('area')">面積</button>
      </div>

      <div class="converter-row">
        <div class="conv-side">
          <input class="conv-input" id="inputA" type="number" value="1" oninput="convertAtoB()">
          <select class="conv-select" id="selectA" onchange="convertAtoB()"></select>
        </div>
        <button class="swap-btn" onclick="swapUnits()" title="互換">⇄</button>
        <div class="conv-side">
          <input class="conv-input" id="inputB" type="number" oninput="convertBtoA()">
          <select class="conv-select" id="selectB" onchange="convertAtoB()"></select>
        </div>
      </div>

      <div class="common-table">
        <h3>常用對照</h3>
        <div class="table-grid" id="commonTable"></div>
      </div>
    </div>
  </div>

  <script>
    const categories = {
      length: {
        units: [
          { label: '公里 (km)', value: 'km', toBase: v => v * 1000 },
          { label: '公尺 (m)',  value: 'm',  toBase: v => v },
          { label: '公分 (cm)', value: 'cm', toBase: v => v / 100 },
          { label: '公厘 (mm)', value: 'mm', toBase: v => v / 1000 },
          { label: '英里 (mi)', value: 'mi', toBase: v => v * 1609.344 },
          { label: '碼 (yd)',   value: 'yd', toBase: v => v * 0.9144 },
          { label: '英尺 (ft)', value: 'ft', toBase: v => v * 0.3048 },
          { label: '英吋 (in)', value: 'in', toBase: v => v * 0.0254 },
        ],
        fromBase: (v, unit) => {
          const map = { km: v/1000, m: v, cm: v*100, mm: v*1000,
                        mi: v/1609.344, yd: v/0.9144, ft: v/0.3048, in: v/0.0254 };
          return map[unit];
        },
        defaults: ['m', 'ft'],
        common: [
          '1 英里 = <span>1.609 公里</span>',
          '1 英尺 = <span>30.48 公分</span>',
          '1 英吋 = <span>2.54 公分</span>',
          '1 公尺 = <span>3.281 英尺</span>',
        ]
      },
      weight: {
        units: [
          { label: '公斤 (kg)', value: 'kg', toBase: v => v },
          { label: '公克 (g)',  value: 'g',  toBase: v => v / 1000 },
          { label: '毫克 (mg)', value: 'mg', toBase: v => v / 1e6 },
          { label: '公噸 (t)',  value: 't',  toBase: v => v * 1000 },
          { label: '磅 (lb)',   value: 'lb', toBase: v => v * 0.453592 },
          { label: '盎司 (oz)', value: 'oz', toBase: v => v * 0.0283495 },
          { label: '台斤',      value: 'catty', toBase: v => v * 0.6 },
        ],
        fromBase: (v, unit) => {
          const map = { kg: v, g: v*1000, mg: v*1e6, t: v/1000,
                        lb: v/0.453592, oz: v/0.0283495, catty: v/0.6 };
          return map[unit];
        },
        defaults: ['kg', 'lb'],
        common: [
          '1 公斤 = <span>2.205 磅</span>',
          '1 磅 = <span>453.6 公克</span>',
          '1 台斤 = <span>600 公克</span>',
          '1 盎司 = <span>28.35 公克</span>',
        ]
      },
      temperature: {
        units: [
          { label: '攝氏 (°C)', value: 'C' },
          { label: '華氏 (°F)', value: 'F' },
          { label: '克氏 (K)',  value: 'K' },
        ],
        convert: (v, from, to) => {
          let c;
          if (from === 'C') c = v;
          else if (from === 'F') c = (v - 32) * 5/9;
          else c = v - 273.15;
          if (to === 'C') return c;
          if (to === 'F') return c * 9/5 + 32;
          return c + 273.15;
        },
        defaults: ['C', 'F'],
        common: [
          '0°C = <span>32°F</span>',
          '100°C = <span>212°F</span>',
          '37°C = <span>98.6°F</span>',
          '20°C = <span>293.15 K</span>',
        ]
      },
      area: {
        units: [
          { label: '平方公里 (km²)', value: 'km2', toBase: v => v * 1e6 },
          { label: '平方公尺 (m²)',  value: 'm2',  toBase: v => v },
          { label: '平方公分 (cm²)', value: 'cm2', toBase: v => v / 1e4 },
          { label: '公頃 (ha)',       value: 'ha',  toBase: v => v * 1e4 },
          { label: '英畝 (acre)',     value: 'acre',toBase: v => v * 4046.86 },
          { label: '坪',              value: 'ping', toBase: v => v * 3.30579 },
          { label: '平方英尺 (ft²)', value: 'ft2', toBase: v => v * 0.092903 },
        ],
        fromBase: (v, unit) => {
          const map = { km2: v/1e6, m2: v, cm2: v*1e4, ha: v/1e4,
                        acre: v/4046.86, ping: v/3.30579, ft2: v/0.092903 };
          return map[unit];
        },
        defaults: ['m2', 'ping'],
        common: [
          '1 坪 = <span>3.306 m²</span>',
          '1 公頃 = <span>3025 坪</span>',
          '1 英畝 = <span>4046.9 m²</span>',
          '1 km² = <span>100 公頃</span>',
        ]
      }
    };

    let currentCat = 'length';

    function setCategory(cat) {
      currentCat = cat;
      document.querySelectorAll('.tab-btn').forEach((b, i) => {
        b.classList.toggle('active', ['length','weight','temperature','area'][i] === cat);
      });
      buildSelects();
      convertAtoB();
      buildCommon();
    }

    function buildSelects() {
      const cat = categories[currentCat];
      [document.getElementById('selectA'), document.getElementById('selectB')].forEach((sel, i) => {
        sel.innerHTML = cat.units.map(u =>
          `<option value="${u.value}">${u.label}</option>`
        ).join('');
        sel.value = cat.defaults[i];
      });
      document.getElementById('inputA').value = 1;
    }

    function doConvert(val, fromUnit, toUnit) {
      const cat = categories[currentCat];
      if (isNaN(val)) return '';
      if (fromUnit === toUnit) return val;
      if (cat.convert) return cat.convert(val, fromUnit, toUnit);
      const base = cat.units.find(u => u.value === fromUnit).toBase(val);
      return cat.fromBase(base, toUnit);
    }

    function fmt(n) {
      if (n === '' || n === undefined) return '';
      const abs = Math.abs(n);
      if (abs === 0) return '0';
      if (abs < 0.0001 || abs >= 1e12) return n.toExponential(6).replace(/\.?0+e/, 'e');
      return parseFloat(n.toPrecision(10)).toString();
    }

    function convertAtoB() {
      const val = parseFloat(document.getElementById('inputA').value);
      const from = document.getElementById('selectA').value;
      const to = document.getElementById('selectB').value;
      document.getElementById('inputB').value = fmt(doConvert(val, from, to));
    }

    function convertBtoA() {
      const val = parseFloat(document.getElementById('inputB').value);
      const from = document.getElementById('selectB').value;
      const to = document.getElementById('selectA').value;
      document.getElementById('inputA').value = fmt(doConvert(val, from, to));
    }

    function swapUnits() {
      const sa = document.getElementById('selectA');
      const sb = document.getElementById('selectB');
      const ia = document.getElementById('inputA');
      const ib = document.getElementById('inputB');
      [sa.value, sb.value] = [sb.value, sa.value];
      ia.value = ib.value;
      convertAtoB();
    }

    function buildCommon() {
      const items = categories[currentCat].common;
      document.getElementById('commonTable').innerHTML = items
        .map(t => `<div class="table-item">${t}</div>`).join('');
    }

    setCategory('length');
  </script>

</body>
</html>
