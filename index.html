<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kit｜簡單好用的小工具集</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav class="navbar">
    <div class="nav-inner">
      <a href="index.html" class="logo">⚙️ Kit</a>
    </div>
  </nav>

  <section class="hero">
    <span class="badge">免費使用</span>
    <h1>簡單好用的<br><span class="accent">小工具集</span></h1>
    <p>瀏覽器直接跑，不收集任何資料。</p>
  </section>

  <section class="tools-grid">

    <a href="tools/calculator.html" class="tool-card">
      <div class="tool-icon" style="background:#e8f5f0; color:#2da58e;">🧮</div>
      <h2>計算機</h2>
      <p>基本四則運算，支援鍵盤輸入，快速好用。</p>
      <span class="tool-link">開始使用 →</span>
    </a>

    <div class="tool-card coming-soon">
      <div class="tool-icon" style="background:#f0eefe; color:#7c6fe0;">🔒</div>
      <h2>密碼產生器</h2>
      <p>自訂長度與字元組合，一鍵產生安全密碼。</p>
      <span class="tool-link muted">開發中...</span>
    </div>

    <div class="tool-card coming-soon">
      <div class="tool-icon" style="background:#fff4e8; color:#e07c2a;">📏</div>
      <h2>單位換算</h2>
      <p>長度、重量、溫度、面積，快速互換單位。</p>
      <span class="tool-link muted">開發中...</span>
    </div>

  </section>

  <div class="footer-note">更多工具持續開發中...</div>

  <footer>
    <p>Kit · 簡單好用的小工具集</p>
  </footer>

</body>
</html>
